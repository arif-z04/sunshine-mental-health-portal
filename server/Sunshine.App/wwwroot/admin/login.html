<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - Sunshine Mental Health</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            admin: { 50: '#f8fafc', 600: '#475569', 800: '#1e293b', 900: '#0f172a' },
            sunshine: { 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-amber-500/20 border border-amber-500/30 text-amber-400 flex items-center justify-center text-2xl mx-auto mb-3">
        🛡️
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight">System Administration</h1>
      <p class="text-xs text-slate-400 mt-1">Dedicated secure portal for Sunshine platform oversight.</p>
    </div>

    <!-- 1-Click Quick Demo Login Helper -->
    <div class="bg-slate-900/60 border border-slate-700/60 rounded-2xl p-3.5 mb-6 text-xs text-slate-300">
      <div class="flex items-center justify-between mb-2 font-bold text-amber-400">
        <span>⚡ Quick Demo Credentials</span>
        <button type="button" onclick="fillAdminDemo()" class="text-[11px] bg-amber-500 text-slate-900 font-extrabold px-2.5 py-0.5 rounded-lg hover:bg-amber-400 transition">
          Auto Fill
        </button>
      </div>
      <p class="text-[11px] text-slate-400">Email: <code class="text-slate-200">admin@sunshine.org</code> • Pass: <code class="text-slate-200">Password123!</code></p>
    </div>

    <form id="admin-login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Admin Email Address</label>
        <input type="email" id="email" required placeholder="admin@sunshine.org" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Master Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500">
      </div>

      <button type="submit" id="btn-submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold py-3.5 rounded-xl text-sm transition shadow-lg shadow-amber-500/20 mt-2">
        Authenticate as Admin
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-700/60 text-center">
      <a href="/" class="text-xs text-slate-400 hover:text-slate-200 font-semibold">← Return to Public Homepage</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    function fillAdminDemo() {
      document.getElementById('email').value = 'admin@sunshine.org';
      document.getElementById('password').value = 'Password123!';
    }

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-submit');

      btn.disabled = true;
      btn.innerText = 'Verifying authorization...';

      try {
        const res = await Sunshine.request('/admin/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (res.token) {
          Sunshine.setAuth(res.token, res.user);
          Sunshine.toast('Welcome, Administrator!', 'success');
          setTimeout(() => {
            window.location.href = '/admin';
          }, 400);
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerText = 'Authenticate as Admin';
      }
    });
  </script>
</body>
</html>
